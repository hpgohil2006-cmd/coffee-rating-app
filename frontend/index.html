<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coffee Rating Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <div class="container">

            <p class="eyebrow">COFFEE COMMUNITY</p>

            <h1>☕ Coffee Rating</h1>

            <p class="subtitle">
                Discover, vote and find the most loved coffee blends.
            </p>

        </div>
    </header>


    <main class="container">

        <section class="section">

            <div class="section-heading">
                <div>
                    <p class="eyebrow">EXPLORE</p>

                    <h2>Choose Your Favourite</h2>
                </div>

                <span
                    id="statusMessage"
                    class="status"
                    aria-live="polite"
                ></span>
            </div>

            <div
                id="coffeeGrid"
                class="coffee-grid"
            >
                <div class="loading">
                    Loading coffee blends...
                </div>
            </div>

        </section>


        <section class="leaderboard-section">

            <div class="section-heading">
                <div>
                    <p class="eyebrow">LEADERBOARD</p>

                    <h2>🏆 Top Rated Coffees</h2>
                </div>
            </div>

            <div
                id="leaderboard"
                class="leaderboard"
            >
                <div class="loading">
                    Loading leaderboard...
                </div>
            </div>

        </section>

    </main>


    <footer>
        <p>
            Coffee Rating Application • Full Stack Development Project
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
